# Publie le site sur versatyl.fr (hébergement OVH).
# Ne se lance JAMAIS tout seul : une modif poussée sur GitHub ne change pas le site public.
# Pour publier : onglet « Actions » du dépôt → « Publier sur versatyl.fr » → « Run workflow ».
#
# Ce qui est envoyé sur OVH (dossier www/) :
#   versatyl.fr/            ← le contenu du dossier ovh/ (page d'accueil)
#   versatyl.fr/shopping/   ← la boutique (tout le dépôt sauf apps-script, ovh, .md)
#
# Envoi en SFTP (chiffré). Le seul secret à renseigner, dans
# Settings → Secrets and variables → Actions : OVH_FTP_PASSWORD (mot de passe FTP OVH).
name: Publier sur versatyl.fr

on:
  workflow_dispatch:

concurrency:
  group: publier-ovh
  cancel-in-progress: false

env:
  OVH_SERVEUR: ssh.cluster129.hosting.ovh.net
  OVH_LOGIN: versatv

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site/shopping
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='apps-script' \
            --exclude='ovh' --exclude='_site' --exclude='*.md' \
            ./ _site/shopping/
          cp -r ovh/. _site/
          echo "Fichiers qui seront en ligne :"
          find _site -type f | sort

      - name: Envoyer sur OVH
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Le secret OVH_FTP_PASSWORD n'est pas renseigné (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            open -u $OVH_LOGIN --env-password sftp://$OVH_SERVEUR;
            mirror --reverse --delete --verbose --parallel=4 _site/ www/;
          "
